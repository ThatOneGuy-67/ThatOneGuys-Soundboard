<!DOCTYPE html>
<html lang="en">
<div id="mainContent">>
    <div id="header">
        <h1>ThatOneGuy's Soundboard</h1>
    </div>
    <div id="controls">
        <button id="toggleFavorites" class="control-button favorites-toggle">⭐ Favorites: OFF</button>
        <button id="toggleButton" class="control-button overlap-toggle">🔇 Overlap: OFF</button>
        <button id="stopButton" class="control-button stop-button">⏹️ Stop All Sounds</button>
        <input id="searchInput" type="text" placeholder="Search sounds...">
    </div>
    <div id="soundboard"></div>
</div>

</div>

</div>

<head>
    <base href="https://cdn.jsdelivr.net/gh/genizy/soundboard@main/">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5521219086088837" crossorigin="anonymous"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-"></script>
    
    <meta charset="UTF-8">
    <title>ThatOneGuy's Soundboard</title>
    <script src="sounds.js" type="module"></script>
    <script src="main.js" type="module"></script>
</head>

<style>

    
    #startpage {
        position: fixed;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        background: rgba(30, 30, 30, 0.85); 
        backdrop-filter: blur(10px);         
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10000;
        text-align: center;
    }

    
    #startpage h1 {
        font-size: 3rem;
        color: #eee;                         
        text-shadow: 0 0 10px rgba(0,0,0,0.6); 
        margin-bottom: 2rem;
        font-weight: bold;
    }

    
    #startButton {
        padding: 1rem 2rem;
        font-size: 1.5rem;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 12px;
        background: rgba(50,50,50,0.8);      
        color: #eee;                         
        cursor: pointer;
        backdrop-filter: blur(5px);           
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
        transition: transform 0.2s, background 0.2s;
    }

    #startButton:hover {
        transform: scale(1.05);
        background: rgba(60,60,60,0.9);       
    }


    #header {
        text-align: center;
        margin-bottom: 1rem;
        height: 1px;
        padding: 100px;
        font-size: larger;
        text-shadow: 0 0 10px #000000;
        -webkit-text-fill-color: #5c5b5b;
    }

   body {
    font-family: sans-serif;
    background: #111;
    color: white;
    margin: 0;
    padding: 2rem;
    }

    #controls {
        position: fixed;
        top: 20px;
        left: 20px;
        right: 20px;
        z-index: 1000;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        padding: 10px;
    }

    .control-button {
        padding: 0.5rem 1rem;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
    }

    .favorites-toggle {
        background: #ffee00;
        color: #444;
    }

    .overlap-toggle {
        background: #444;
        color: white;
    }

    .stop-button {
        background: #aa0000;
        color: white;
    }

    #search-input {
        padding: 0.5rem 1rem;
        border-radius: 8px;
        border: 1px solid #ccc;
        flex: 1;
    }

    #soundboard {
        display: flex;
        flex-wrap: wrap;
        gap: 2rem;
        justify-content: center;
        margin-top: 100px;
    }

    .sound-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 120px;
    }

    .sound-wrapper:hover {
        transform: scale(1.05);
        filter: brightness(1.2);
        transition: 10ms;
    }

    .sound-button-img {
        all: unset;
        cursor: pointer;
        width: 100px;
        height: 100px;
        position: relative;
    }

    .sound-image {
        width: 100%;
        height: 100%;
        background-color: var(--btn-color);
        background-image: url('https://cdn.jsdelivr.net/gh/genizy/soundboard@155ea6666132bde6f7f14c413431e0fd7eaeaba9/button.png');
        background-size: cover;
        background-position: center;
        background-blend-mode: multiply;
        border-radius: 50%;
        transition: transform 0.1s, filter 0.2s;
        box-shadow: 0 0 8px var(--btn-color);
    }

    .sound-image.pressed {
        background-image: url('https://cdn.jsdelivr.net/gh/genizy/soundboard@155ea6666132bde6f7f14c413431e0fd7eaeaba9/button_pressed.png');
        transform: scale(0.95);
    }

    .sound-label {
        margin-top: 0.5rem;
        text-align: center;
        font-size: 0.9rem;
        color: #eee;
        font-weight: bold;
        word-break: break-word;
    }

    .right-click-panel {
        background: white;
        border: 1px solid #ccc;
        padding: 8px;
        z-index: 1000;
        border-radius: 4px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .right-click-panel-label {
        font-weight: bold;
        margin-bottom: 5px;
    }

    .right-click-panel-button {
        padding: 5px;
    }

    #footer {

        bottom: 0;
        width: 100%;
        text-align: center;
        padding: 10px 0;
        font-size: 0.4rem;
        color: #464646;                          
        text-shadow: 0 0 10px rgba(0,0,0,0.6); 
        font-weight: bold;
    }

</style>

<body>

    <div id="startpage">
        <h1>Welcome to ThatOneGuy's Soundboard</h1>
        <button id="startButton">Start</button>
    </div>

    <div id="footer">
        <h1>@ThatOneGuy's Inc.</h1>
    </div>
    
    <script>
        document.getElementById('startButton').addEventListener('click', function() {
            document.getElementById('startpage').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
        });
    </script>

</body>

</html>
