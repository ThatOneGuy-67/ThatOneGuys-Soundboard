<!DOCTYPE html>
<html>
<body style="margin:0">

<iframe id="app" style="width:100%;height:100vh;border:none;"></iframe>

<script>
fetch("https://cdn.jsdelivr.net/gh/genizy/soundboard@main/")
  .then(r => r.text())
  .then(html => {
    document.getElementById("app").srcdoc = html;
  });
</script>

</body>
</html>
